[package]
name = "passvault"
version = "0.2.3"
description = "A local-first encrypted password manager"
authors = ["Passvault"]
edition = "2021"

[lib]
name = "passvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
csv = "1.3"
data-encoding = "2.6"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
totp-rs = { version = "5", features = ["otpauth", "zeroize"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
